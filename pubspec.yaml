name: my_proj
description: "A new Flutter project."
publish_to: 'none'

environment:
  sdk: '^3.6.0'

dev_dependencies:
  melos: ^6.1.0

packages:
  - packages/**

scripts:
  get:
    exec: flutter pub get
  build:
    exec: dart run build_runner build --delete-conflicting-outputs
  clean:
    exec: flutter clean

